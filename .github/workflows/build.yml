name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Go tests
        run: go test ./...

      - name: Go vet
        run: go vet ./...

      - name: Lint Go
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0

      - name: Verify release notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: ./scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > /dev/null

  build:
    name: Build ${{ matrix.artifact }}
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            task: darwin:package:universal
            artifact: Verk-macos-universal
          - os: windows-latest
            # Builds Verk.exe and the NSIS installer next to it.
            task: windows:package
            artifact: Verk-windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Add Go binaries to PATH (Unix)
        if: runner.os != 'Windows'
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Add Go binaries to PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "$(go env GOPATH)\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install NSIS (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
            echo "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }

      - name: Resolve version
        id: version
        shell: bash
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build
        shell: bash
        run: wails3 task ${{ matrix.task }} VERSION=${{ steps.version.outputs.value }}

      - name: Package macOS app
        if: runner.os == 'macOS'
        run: |
          cd build/bin
          ditto -c -k --keepParent Verk.app ../Verk-macos-universal.zip
          shasum -a 256 ../Verk-macos-universal.zip | awk '{print $1}' > ../Verk-macos-universal.zip.sha256

      - name: Package Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # The zip feeds the in-app updater; the installer is for first installs.
          # Todo.exe is a copy for updaters released before the rename (1.4.0
          # and older), which only extract that name. Drop it once they are gone.
          Copy-Item build/bin/Verk.exe build/bin/Todo.exe
          Compress-Archive -Path build/bin/Verk.exe, build/bin/Todo.exe -DestinationPath build/Verk-windows-x64.zip
          $hash = (Get-FileHash build/Verk-windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  Verk-windows-x64.zip" | Out-File -Encoding ascii build/Verk-windows-x64.zip.sha256
          Copy-Item build/bin/Verk-amd64-installer.exe build/Verk-windows-x64-setup.exe
          $hash = (Get-FileHash build/Verk-windows-x64-setup.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  Verk-windows-x64-setup.exe" | Out-File -Encoding ascii build/Verk-windows-x64-setup.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            build/*.zip
            build/*-setup.exe
            build/*.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract release notes
        shell: bash
        run: ./scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > release-notes.md

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            dist/*.zip
            dist/*-setup.exe
            dist/*.sha256

