<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Verk app icon: the lowercase « v. » monogram on a lavender squircle.
       Source of build/appicon.png and src/trayicons/appicon.png (see README.md here). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8f80f6"/>
      <stop offset="1" stop-color="#5f4ad9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.2" r="0.45">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#3b2a9a" flood-opacity="0.22"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <rect x="52" y="52" width="920" height="920" rx="212" fill="url(#bg)"/>
  </g>
  <rect x="52" y="52" width="920" height="920" rx="212" fill="url(#glow)"/>
  <rect x="53" y="53" width="918" height="918" rx="211" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="2"/>
  <g transform="translate(52 52) scale(14.375)">
    <path d="M17 21.5 L27 42.5 L37 21.5" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="46" cy="40.5" r="5.2" fill="#ffffff" fill-opacity="0.62"/>
  </g>
</svg>
