<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Finder icon of the .dmg file (build/darwin/dmg-file-icon.icns): a light
       disk carrying the « v. » app icon. -->
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#efece7"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e4e0da"/>
      <stop offset="1" stop-color="#d2cdc5"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8f80f6"/>
      <stop offset="1" stop-color="#5f4ad9"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#2c2721" flood-opacity="0.22"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#3b2a9a" flood-opacity="0.25"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- Body: top face and front edge. -->
    <path d="M150 300 Q150 196 254 196 H770 Q874 196 874 300 V720 H150 Z" fill="url(#top)"/>
    <path d="M150 700 H874 V760 Q874 836 798 836 H226 Q150 836 150 760 Z" fill="url(#front)"/>
  </g>
  <path d="M150 700 H874" stroke="#ffffff" stroke-opacity="0.9" stroke-width="4"/>
  <rect x="151.5" y="197.5" width="721" height="637" rx="102" fill="none" stroke="#c9c3ba" stroke-opacity="0.6" stroke-width="3"/>
  <!-- Vents and status light on the front edge. -->
  <g fill="#b9b3aa">
    <rect x="236" y="752" width="14" height="40" rx="7"/>
    <rect x="266" y="752" width="14" height="40" rx="7"/>
    <rect x="296" y="752" width="14" height="40" rx="7"/>
    <rect x="326" y="752" width="14" height="40" rx="7"/>
  </g>
  <circle cx="786" cy="772" r="11" fill="#7b6cf0"/>
  <!-- The app icon on the top face. -->
  <g filter="url(#soft)">
    <rect x="352" y="288" width="320" height="320" rx="74" fill="url(#mark)"/>
  </g>
  <g transform="translate(352 288) scale(5)">
    <path d="M17 21.5 L27 42.5 L37 21.5" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="46" cy="40.5" r="5.2" fill="#fff" fill-opacity="0.62"/>
  </g>
</svg>
