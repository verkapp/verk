<!doctype html>
<html lang="fr" data-accent="lavande">
  <head>
    <meta charset="utf-8" />
    <title>Verk</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <script>
      // Carry over the per-view preferences saved before the app became Verk.
      try {
        for (let i = localStorage.length - 1; i >= 0; i--) {
          const key = localStorage.key(i);
          if (key && key.startsWith('todo.')) {
            const next = 'verk.' + key.slice(5);
            if (localStorage.getItem(next) === null) {
              localStorage.setItem(next, localStorage.getItem(key));
            }
            localStorage.removeItem(key);
          }
        }
      } catch (e) {}
      // Avoid an accent or theme flash before the backend settings are loaded.
      let theme = 'system';
      try {
        const raw = localStorage.getItem('verk.settings');
        if (raw) {
          const settings = JSON.parse(raw);
          if (settings && settings.accent) {
            document.documentElement.dataset.accent = settings.accent;
          }
          if (settings && settings.theme) {
            theme = settings.theme;
          }
        }
      } catch (e) {}
      const systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.theme = theme === 'dark' || (theme === 'system' && systemDark) ? 'dark' : 'light';
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
